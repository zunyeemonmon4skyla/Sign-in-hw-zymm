<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: url('https://i.pinimg.com/1200x/04/7b/22/047b223d5b2d03e540fde17000c53f24.jpg');
            background-size: cover;
            background-position: center;
            min-height: 150vh;
        }

        .site-footer {
            background-color: #1d2b56;
            color: #fff;
            padding: 50px 40px 20px 40px;
            margin-top: auto;
            width: 100%;
        }

        .footer-content {
            max-width: 1200px; 
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 60px;
            padding-bottom: 40px;
            padding-left: 20px; 
            padding-right: 20px;
            flex-wrap: wrap;
        }

        .footer-col-left {
            flex: 1.5;
            min-width: 280px;
        }

        .footer-col-right {
            flex: 1;
            min-width: 280px;
        }

        .footer-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .footer-logo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
        }

        .footer-brand h4 {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 2px;
        }

        .footer-sub {
            font-size: 0.9rem;
            color: #aaa;
            margin: 0;
        }

        .footer-links-list {
            list-style: none;
            padding: 0;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .footer-links-list a {
            color: #bbb;
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 0.5px;
            transition: color 0.2s;
        }

        .footer-links-list a:hover {
            color: #d4af37;
        }

        /* Social Icons Row */
        .footer-socials {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        .footer-socials a {
            color: #fff;
            font-size: 1.2rem;
            transition: color 0.2s;
        }

        .footer-socials a:hover {
            color: #d4af37;
        }

        .footer-bottom {
            max-width: 1200px;
            margin: 0 auto;
            border-top: 2px solid rgba(255, 255, 255, 0.1);
            padding-top: 20px;
            text-align: center;
        }

        .footer-bottom p {
            font-size: 0.9rem;
            color: #aaa;
            margin: 0;
        }
    </style>
</head>
<body class="d-flex flex-column justify-content-between align-items-center">
    <div class="card shadow-lg p-4 p-md-5 rounded-4 bg-white border-0 my-4" style="width: 100%; max-width: 420px;">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-dark mb-1">Sign in</h2>
            <p class="text-muted small">Join us today! Please fill in your details.</p>
        </div>

        <form action="#" method="GET">
            <div class="mb-3">
                <label class="form-label text-uppercase fw-semibold text-secondary" style="font-size: 0.75rem;">Email address</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-solid fa-envelope"></i></span>
                    <input type="email" class="form-control bg-light border-start-0 ps-0 shadow-none" placeholder="Enter your email" required>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label text-uppercase fw-semibold text-secondary" style="font-size: 0.75rem;">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" class="form-control bg-light border-start-0 ps-0 shadow-none" placeholder="Enter your password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold text-uppercase tracking-wider shadow-sm" style="font-size: 0.85rem;">
                Sign In
            </button>
        </form>

        <div class="position-relative my-4">
            <hr class="text-muted opacity-25">
            <span class="position-absolute top-50 start-50 translate-middle bg-white px-2 text-muted text-uppercase" style="font-size: 0.7rem;">
                Or sign in with
            </span>
        </div>

        <div class="d-flex justify-content-center gap-3 mb-4">
            <a href="#" class="btn btn-light border rounded-circle d-flex align-items-center justify-content-center text-dark shadow-sm" style="width: 45px; height: 45px;">
                <i class="fa-brands fa-google"></i>
            </a>
            <a href="#" class="btn btn-light border rounded-circle d-flex align-items-center justify-content-center text-dark shadow-sm" style="width: 45px; height: 45px;">
                <i class="fa-brands fa-github"></i>
            </a>
            <a href="#" class="btn btn-light border rounded-circle d-flex align-items-center justify-content-center text-dark shadow-sm" style="width: 45px; height: 45px;">
                <i class="fa-brands fa-twitter"></i>
            </a>
        </div>

        <div class="text-center">
            <p class="text-muted small mb-0">Already have an account? <a href="#" class="text-primary text-decoration-none fw-semibold">Log in</a></p>
        </div>

    </div>


    <footer class="site-footer">
        <div class="footer-content">
            <div class="footer-col-left">
                <div class="footer-brand">
                    <img src="https://i.pinimg.com/736x/67/f6/ba/67f6badd7a710a5fe1b095fb1a083513.jpg" alt="Logo" class="footer-logo">
                    <div>
                        <h4>ZYMM - Skyla</h4>
                        <p class="footer-sub">Year 9</p>
                    </div>
                </div>

                <ul class="footer-links-list">
                    <li><a href="index.html">HOME</a></li>
                    <li><a href="Leaderboard.html">LEADER BOARD</a></li>
                    <li><a href="about.html">ABOUT US</a></li>
                    <li><a href="#faq-section">FAQ</a></li>
                </ul>

                <div class="footer-socials">
                    <a href="#" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
                    <a href="#" aria-label="Twitter"><i class="fa-brands fa-twitter"></i></a>
                    <a href="#" aria-label="YouTube"><i class="fa-brands fa-youtube"></i></a>
                    <a href="#" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
                </div>
            </div>
            
            <div class="footer-col-right">
                <div class="p-4 rounded-3 border border-dark" style="background-color: white;">
                    <h5 class="text-dark fw-semibold mb-3" style="font-size: 1rem;">Get the latest News</h5>
                    <form action="#" method="GET">
                        <div class="input-group mb-3">
                            <input type="email" class="form-control text-dark border-dark shadow-none" placeholder="Your email here" style="font-size: 0.9rem;" required>
                            <button class="btn btn-info fw-semibold text-dark px-4" type="submit" style="font-size: 0.9rem;">Subscribe</button>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input shadow-none  border-dark" type="checkbox" id="termsCheck" required>
                            <label class="form-check-label text-muted small" for="termsCheck" style="font-size: 0.8rem; color:rgb(16, 15, 15) !important;">
                                I accept terms and policy of this school.
                            </label>
                        </div>
                    </form>
                </div>
            </div>

        </div>

        <div class="footer-bottom">
            <p>&copy; 2026 Year 9 student ZYMM. All rights reserved.</p>
        </div>
    </footer>


</body>
</html>
